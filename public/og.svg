<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="120" fill="url(#acc)" opacity="0.35" filter="url(#soft)"/>
  <circle cx="240" cy="520" r="160" fill="url(#acc)" opacity="0.22" filter="url(#soft)"/>

  <g fill="#e5e7eb" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">
    <text x="84" y="230" font-size="64" font-weight="800">Luka Gligorevic</text>
    <text x="84" y="290" font-size="28" fill="#94a3b8">Mobile &amp; Frontend Developer</text>
  </g>

  <g>
    <rect x="84" y="340" width="86" height="6" rx="3" fill="url(#acc)"/>
  </g>

  <g fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <text x="84" y="410" font-size="18" opacity="0.9">React Native (Expo) &#183; Next.js &#183; FastAPI &#183; AWS</text>
    <text x="84" y="444" font-size="18" opacity="0.75">Portfolio</text>
  </g>
</svg>
